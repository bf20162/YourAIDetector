<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourAI Content Detector</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
        }
        /* Custom scrollbar for text area */
        #textInput::-webkit-scrollbar {
            width: 8px;
        }
        #textInput::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        #textInput::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        #textInput::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Style for the segmented text area */
        #highlightedText span {
            display: inline;
            transition: background-color 0.2s;
        }
        #highlightedText p {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="min-h-screen flex items-start justify-center p-4 sm:p-8 bg-gray-50">

    <div class="w-full max-w-4xl bg-white shadow-xl rounded-2xl overflow-hidden mt-6">
        <!-- Header -->
        <header class="p-6 bg-blue-600 text-white flex items-center justify-between">
            <h1 class="text-3xl font-extrabold flex items-center">
                <i data-lucide="scan" class="w-7 h-7 mr-3"></i>
                YourAI Content Detector
            </h1>
            <span class="text-sm font-medium opacity-80 hidden sm:block">Analyze with YourAI</span>
        </header>

        <main class="p-6 md:p-8 space-y-8">
            <!-- Input Section -->
            <section class="space-y-4">
                <label for="textInput" class="block text-lg font-semibold text-gray-800">
                    Paste Text for Analysis (Min 20 words)
                </label>
                <textarea id="textInput" rows="10"
                    class="w-full p-4 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition duration-150 shadow-inner resize-none text-gray-700"
                    placeholder="E.g., The confluence of digital automation and machine learning algorithms suggests a paradigm shift in human-computer interaction, leading to unprecedented efficiencies across various industrial sectors."></textarea>
                
                <!-- NEW: Attachment Section -->
                <label for="fileInput" class="block text-lg font-semibold text-gray-800 pt-4 border-t border-gray-200">
                    Optional: Add Attachment (PNG, JPG for context; copy text from PDF/DOCX)
                </label>
                <!-- Updated accept attribute to include common document types for better user experience -->
                <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document" onchange="handleImageUpload(event)" 
                    class="w-full text-sm text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
                
                <!-- Image Preview -->
                <div id="imagePreviewContainer" class="hidden mt-4 relative">
                    <img id="imagePreview" class="max-h-60 w-auto rounded-xl shadow-lg border border-gray-300 object-contain mx-auto" src="" alt="Image Preview"/>
                    <button onclick="removeImage()" class="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1 shadow-lg hover:bg-red-600 transition duration-150">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <!-- END NEW: Attachment Section -->


                <div class="flex justify-end">
                    <button onclick="analyzeText()" id="analyzeButton"
                        class="px-8 py-3 bg-blue-600 text-white font-semibold rounded-xl shadow-lg hover:bg-blue-700 transition duration-200 focus:outline-none focus:ring-4 focus:ring-blue-300 flex items-center disabled:opacity-50"
                        title="Start Analysis">
                        <i data-lucide="search" class="w-5 h-5 mr-2"></i>
                        Analyze Text
                    </button>
                </div>
            </section>

            <!-- Results Section -->
            <section id="resultsSection" class="hidden space-y-6 pt-4 border-t border-gray-200">
                <h2 class="2xl font-bold text-gray-800 flex items-center">
                    <i data-lucide="zap" class="w-6 h-6 mr-2 text-blue-600"></i>
                    Detection Results
                </h2>

                <div id="loadingIndicator" class="hidden text-center p-8">
                    <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full"></div>
                    <p class="mt-3 text-gray-600">Analyzing text characteristics...</p>
                </div>

                <!-- Detection Summary Card -->
                <div id="summaryCard" class="p-6 border-2 border-gray-100 rounded-xl shadow-md hidden">
                    <div class="flex flex-col sm:flex-row items-center justify-between">
                        <div class="space-y-1 mb-4 sm:mb-0">
                            <p class="text-sm font-medium text-gray-500">Overall Classification</p>
                            <h3 id="classificationOutput" class="text-3xl font-extrabold text-gray-900"></h3>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-medium text-gray-500">AI Confidence Score</p>
                            <div class="flex items-end justify-end">
                                <span id="confidenceOutput" class="text-5xl font-extrabold leading-none text-blue-600"></span>
                                <span class="text-xl font-bold ml-1 text-blue-600">%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Highlighted Output Area -->
                <div id="highlightedOutputCard" class="p-6 bg-gray-50 rounded-xl border border-gray-200 shadow-md hidden">
                    <h4 class="text-lg font-semibold text-gray-800 flex items-center mb-4 border-b pb-2">
                        <i data-lucide="highlighter" class="w-5 h-5 mr-2 text-blue-500"></i>
                        Segment Analysis & Highlighting
                    </h4>
                    <div id="highlightedText" class="text-lg leading-relaxed text-gray-700">
                        <!-- Analyzed text segments will go here -->
                    </div>
                    <div class="mt-4 flex flex-wrap gap-4 pt-4 border-t border-gray-200 text-sm font-medium text-gray-600">
                        <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-green-300 mr-2"></span>Human-Written</span>
                        <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-red-300 mr-2"></span>AI-Generated</span>
                        <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-gray-300 mr-2"></span>Inconclusive</span>
                    </div>
                </div>
                
                <!-- Justification -->
                <div id="justificationCard" class="p-6 bg-white rounded-xl border border-gray-200 hidden">
                    <h4 class="text-lg font-semibold text-gray-800 flex items-center mb-3">
                        <i data-lucide="book-open-text" class="w-5 h-5 mr-2 text-blue-500"></i>
                        Linguistic Justification
                    </h4>
                    <p id="justificationOutput" class="text-gray-700 leading-relaxed"></p>
                </div>
            </section>

            <!-- Error/Message Box -->
            <div id="messageBox" class="hidden p-4 text-sm rounded-lg" role="alert">
                <div id="messageText"></div>
            </div>
        </main>
    </div>

    <script>
        // Global Constants
        const API_URL_BASE = 'https://generativelanguage.googleapis.com/v1beta/models/';
        const MODEL = 'gemini-2.5-flash-preview-09-2025';
        const API_KEY = ""; // Canvas will provide this if it's empty

        // New Global Variables for Image Handling
        let base64Image = null;
        let imageMimeType = null;


        // DOM elements
        const textInput = document.getElementById('textInput');
        const analyzeButton = document.getElementById('analyzeButton');
        const fileInput = document.getElementById('fileInput'); // New
        const imagePreviewContainer = document.getElementById('imagePreviewContainer'); // New
        const imagePreview = document.getElementById('imagePreview'); // New
        const resultsSection = document.getElementById('resultsSection');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const summaryCard = document.getElementById('summaryCard');
        const justificationCard = document.getElementById('justificationCard');
        const highlightedOutputCard = document.getElementById('highlightedOutputCard');
        const highlightedText = document.getElementById('highlightedText');
        const classificationOutput = document.getElementById('classificationOutput');
        const confidenceOutput = document.getElementById('confidenceOutput');
        const justificationOutput = document.getElementById('justificationOutput');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');

        // Initial setup for icons
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
        
        // New function to handle file upload and conversion
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                // Check for supported image types (PNG, JPG, JPEG)
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        // Store base64 data and mime type globally
                        base64Image = e.target.result.split(',')[1];
                        imageMimeType = file.type;

                        // Update preview UI
                        imagePreview.src = e.target.result;
                        imagePreviewContainer.classList.remove('hidden');
                        if (typeof lucide !== 'undefined') {
                            lucide.createIcons(); // Re-render icons after adding new element
                        }
                        showMessage(`Image attached: ${file.name}. It will be used for analysis context.`, 'success');
                    };
                    reader.readAsDataURL(file);
                } else if (file.type === 'application/pdf' || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
                    // Handle PDF/DOCX files (unsupported for client-side reading)
                    removeImage(); // Clear any previous image state
                    showMessage(`File attached: ${file.name}. For best analysis, please copy the text content from your document and paste it into the analysis box above, as direct file OCR is not supported in this client-side application.`, 'error');
                } else {
                    // General unsupported file type
                    removeImage();
                    showMessage("Unsupported file type. Please upload a PNG, JPG, or JPEG image for context, or copy the text from your document.", 'error');
                }
            } else {
                removeImage();
            }
        }

        // New function to remove the image
        function removeImage() {
            base64Image = null;
            imageMimeType = null;
            fileInput.value = ''; // Clear the file input
            imagePreview.src = '';
            imagePreviewContainer.classList.add('hidden');
        }


        // Utility function for exponential backoff retry
        async function fetchWithRetry(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) {
                        return response;
                    } else if (response.status === 429 && i < maxRetries - 1) {
                        // Too Many Requests, wait and retry
                        const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                        console.warn(`Rate limit hit (429). Retrying in ${delay / 1000}s...`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                        continue;
                    } else {
                        throw new Error(`API request failed with status ${response.status}`);
                    }
                } catch (error) {
                    if (i === maxRetries - 1) {
                        throw error;
                    }
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    console.error(`Fetch error. Retrying in ${delay / 1000}s:`, error);
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            throw new Error("Failed to fetch after multiple retries.");
        }

        // --- UI Helper Functions ---

        function showMessage(text, type = 'error') {
            messageText.textContent = text;
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800');
            if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-400');
            } else if (type === 'success') {
                messageBox.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-400');
            }
        }

        function hideMessage() {
            messageBox.classList.add('hidden');
        }

        function setLoading(isLoading) {
            analyzeButton.disabled = isLoading;
            loadingIndicator.classList.toggle('hidden', !isLoading);
            if (isLoading) {
                analyzeButton.innerHTML = `<div class="animate-spin w-5 h-5 border-2 border-white border-t-transparent rounded-full mr-2"></div> Analyzing...`;
                resultsSection.classList.add('hidden');
                summaryCard.classList.add('hidden');
                justificationCard.classList.add('hidden');
                highlightedOutputCard.classList.add('hidden');
            } else {
                analyzeButton.innerHTML = `<i data-lucide="search" class="w-5 h-5 mr-2"></i> Analyze Text`;
                lucide.createIcons();
            }
        }

        function updateResultCard(analysis) {
            const classification = analysis.overallClassification;
            const confidence = analysis.overallConfidence;
            const justification = analysis.justification;
            const analysisSegments = analysis.analysisSegments || [];
            
            // Normalize inputs
            const score = parseInt(confidence.replace('%', ''), 10);
            const classText = classification.toUpperCase();

            // 1. Update Summary Card
            classificationOutput.textContent = classText;
            confidenceOutput.textContent = score;

            // Determine colors based on classification/score
            let colorClass = 'text-gray-900';
            let borderClass = 'border-gray-100';
            let confidenceColor = 'text-blue-600';

            if (classText === 'AI') {
                if (score >= 80) { // High confidence AI
                    colorClass = 'text-red-600';
                    borderClass = 'border-red-300';
                    confidenceColor = 'text-red-600';
                } else { // Moderate AI
                    colorClass = 'text-orange-600';
                    borderClass = 'border-orange-300';
                    confidenceColor = 'text-orange-600';
                }
            } else if (classText === 'HUMAN') {
                if (score >= 80) { // High confidence Human
                    colorClass = 'text-green-600';
                    borderClass = 'border-green-300';
                    confidenceColor = 'text-green-600';
                } else { // Moderate Human
                    colorClass = 'text-lime-600';
                    borderClass = 'border-lime-300';
                    confidenceColor = 'text-lime-600';
                }
            } else if (classText === 'INCONCLUSIVE') {
                 // Inconclusive
                colorClass = 'text-gray-500';
                borderClass = 'border-gray-300';
                confidenceColor = 'text-gray-500';
            }

            // Apply styles to Summary Card
            classificationOutput.className = `text-3xl font-extrabold ${colorClass}`;
            confidenceOutput.className = `text-5xl font-extrabold leading-none ${confidenceColor}`;
            summaryCard.className = `p-6 border-2 rounded-xl shadow-md ${borderClass}`;
            
            // 2. Update Justification Card
            justificationOutput.textContent = justification;

            // 3. Update Highlighted Output Area
            highlightedText.innerHTML = '';
            
            analysisSegments.forEach(segment => {
                const span = document.createElement('span');
                span.textContent = segment.text;
                
                let highlightClass = 'bg-transparent';
                let tooltip = '';

                if (segment.classification.toUpperCase() === 'AI') {
                    highlightClass = 'bg-red-300 bg-opacity-30 hover:bg-red-400 hover:bg-opacity-50 transition duration-150 rounded-sm px-1';
                    tooltip = 'Likely AI-Generated';
                } else if (segment.classification.toUpperCase() === 'HUMAN') {
                    highlightClass = 'bg-green-300 bg-opacity-30 hover:bg-green-400 hover:bg-opacity-50 transition duration-150 rounded-sm px-1';
                    tooltip = 'Likely Human-Written';
                } else {
                    highlightClass = 'bg-gray-300 bg-opacity-30 hover:bg-gray-400 hover:bg-opacity-50 transition duration-150 rounded-sm px-1';
                    tooltip = 'Inconclusive/Mixed';
                }
                
                // Add a small space for visual separation
                const space = document.createTextNode(' '); 

                span.className = `inline ${highlightClass} cursor-help`;
                span.title = tooltip;
                
                highlightedText.appendChild(span);
                highlightedText.appendChild(space);
            });
            
            // 4. Show Results
            resultsSection.classList.remove('hidden');
            summaryCard.classList.remove('hidden');
            justificationCard.classList.remove('hidden');
            highlightedOutputCard.classList.remove('hidden');
        }

        // --- Main Logic ---

        async function analyzeText() {
            const userQuery = textInput.value.trim();

            if (userQuery.split(/\s+/).length < 20) {
                showMessage("Please enter a longer text (at least 20 words) for a meaningful analysis.", 'error');
                return;
            }

            hideMessage();
            setLoading(true);

            // Build the content parts array
            const contents = [];

            // 1. Add image part if present
            if (base64Image && imageMimeType) {
                contents.push({
                    inlineData: {
                        mimeType: imageMimeType,
                        data: base64Image
                    }
                });
            }

            // 2. Add text part (MUST be included)
            contents.push({ text: userQuery });


            // System instructions for the AI Analysis Engine - REVISED for nuanced professional text analysis
            const systemPrompt = `You are an expert Linguistic AI Detection Engine specialized in academic and professional texts. Your primary task is to analyze the text provided and determine the likelihood of it being AI-generated or human-written. When analyzing high-quality, professional text (which naturally exhibits high perplexity and consistent structure), you must use advanced linguistic differentiation criteria:

            1.  **Humanity Markers (High Weight for Human Classification):** Look for subtle elements that suggest genuine human thought and expertise, even within formal writing:
                * **Nuance & Tentativeness:** Phrases that hedge claims or show careful reasoning (e.g., "It could be argued," "The data suggests, though not conclusively," "However, limitations exist").
                * **Distinctive/Idiosyncratic Voice:** Unique phrasing, intentional structural variations, or unconventional but clear word choices that deviate from common, predictable LLM training patterns.
                * **Specific, Complex Reference Density:** Use of highly specific, technical terminology, internal cross-references, or domain-specific language that indicates deep human expertise and knowledge synthesis beyond typical LLM training data.

            2.  **AI Markers (High Weight for AI Classification):** Look for characteristics of generic LLM output, even if grammatically perfect:
                * **Syntactic Monotony:** Predictable sentence transitions and uniform paragraph structure (high mechanical regularity).
                * **Generic Verbiage:** Excessive reliance on predictable transitional phrases ("In conclusion," "Furthermore," "However, it is important to note").
                * **Pristine Perfection:** Lack of any natural human artifacts, such as minor stylistic inconsistencies or subtle shifts in tone.

            The uploaded image is for **context only**; focus your linguistic analysis solely on the text provided. Do not analyze the content of the image itself, only use it as context if the text refers to it.

            Provide an overall summary and then a detailed array of segmented analysis. The 'overallConfidence' must reflect the probability the text is AI-generated (e.g., '85%' means 85% confidence it is AI).

            Respond STRICTLY in the requested JSON format.

            The JSON must contain:
            1. 'overallClassification': must be one of 'Human', 'AI', or 'Inconclusive' (overall score).
            2. 'overallConfidence': a percentage string reflecting the AI likelihood (e.g., '92%').
            3. 'justification': a single, detailed paragraph explaining the overall score based on the analysis criteria.
            4. 'analysisSegments': an ARRAY of objects, where each object has 'text' (the original segment) and 'classification' ('Human', 'AI', or 'Inconclusive'). Ensure segments are grammatically separate (sentences or clauses).`;

            // Payload for the Gemini API call
            const payload = {
                contents: [{ parts: contents }], // Pass the contents array here
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            "overallClassification": {
                                "type": "STRING",
                                "enum": ["Human", "AI", "Inconclusive"]
                            },
                            "overallConfidence": { "type": "STRING" },
                            "justification": { "type": "STRING" },
                            "analysisSegments": {
                                "type": "ARRAY",
                                "items": {
                                    "type": "OBJECT",
                                    "properties": {
                                        "text": { "type": "STRING" },
                                        "classification": {
                                            "type": "STRING",
                                            "enum": ["Human", "AI", "Inconclusive"]
                                        }
                                    },
                                    "required": ["text", "classification"]
                                }
                            }
                        },
                        required: ["overallClassification", "overallConfidence", "justification", "analysisSegments"],
                        propertyOrdering: ["overallClassification", "overallConfidence", "justification", "analysisSegments"]
                    }
                }
            };

            try {
                const url = `${API_URL_BASE}${MODEL}:generateContent?key=${API_KEY}`;
                const response = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.candidates && result.candidates.length > 0 &&
                    result.candidates[0].content && result.candidates[0].content.parts &&
                    result.candidates[0].content.parts.length > 0) {

                    const jsonString = result.candidates[0].content.parts[0].text;
                    const analysis = JSON.parse(jsonString);

                    // Check if the JSON is valid and complete
                    if (analysis.overallClassification && analysis.overallConfidence && analysis.justification && analysis.analysisSegments) {
                        updateResultCard(analysis);
                        showMessage("Analysis complete!", 'success');
                    } else {
                        throw new Error("Received incomplete or invalid analysis data from the model.");
                    }
                } else {
                    const errorMsg = result.error?.message || "An unknown error occurred during analysis. Please try again.";
                    throw new Error(errorMsg);
                }

            } catch (error) {
                console.error("AI Detection Error:", error);
                showMessage(`Failed to analyze text: ${error.message || "Network or API error."}`, 'error');
            } finally {
                setLoading(false);
            }
        }
    </script>
</body>
</html>
